<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>NaviGo AI | Explore CAMANAVA</title>

<style>
    @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap');

    :root {
        --primary-blue: #0071e3;
        --glass-bg: rgba(255, 255, 255, 0.45);
        --glass-border: rgba(255, 255, 255, 0.8);
        --text-header: #1d1d1f;
        --text-sub: #6e6e73;
        --bot-bubble: rgba(255, 255, 255, 0.7);
        --bg-scaffold: #f5f5f7;
        --transition-speed: 0.4s;
        --font-main: 'Poppins', sans-serif;
    }

    body.dark-mode {
        --glass-bg: rgba(28, 28, 30, 0.65);
        --glass-border: rgba(255, 255, 255, 0.15);
        --text-header: #ffffff;
        --text-sub: #ebebeb;
        --bot-bubble: rgba(44, 44, 46, 0.85);
        --bg-scaffold: #000000;
    }

    body {
        margin: 0;
        background-color: var(--bg-scaffold);
        transition: background-color var(--transition-speed) ease;
        background-image: 
            radial-gradient(at 0% 0%, rgba(0, 113, 227, 0.25) 0px, transparent 50%),
            radial-gradient(at 100% 100%, rgba(0, 210, 255, 0.2) 0px, transparent 50%),
            radial-gradient(at 100% 0%, rgba(255, 0, 150, 0.15) 0px, transparent 50%);
        height: 100vh;
        height: 100dvh;
        display: flex;
        justify-content: center;
        align-items: center;
        font-family: var(--font-main);
        overflow: hidden;
    }

    .chat-shell {
        width: 100%;
        max-width: 480px;
        height: 90vh;
        height: 90dvh;
        display: flex;
        flex-direction: column;
        background: var(--glass-bg);
        backdrop-filter: blur(40px) saturate(200%);
        -webkit-backdrop-filter: blur(40px) saturate(200%);
        border-radius: 38px;
        box-shadow: 0 30px 60px rgba(0, 0, 0, 0.2);
        border: 1px solid var(--glass-border);
        overflow: hidden;
        transition: all 0.4s ease;
        z-index: 10;
    }

    header {
        padding: 24px 28px;
        border-bottom: 1px solid var(--glass-border);
        display: flex;
        justify-content: space-between;
        align-items: center;
        flex-shrink: 0;
    }

    header h1 { font-weight: 700; font-size: 1.5rem; margin: 0; color: var(--text-header); }
    .logo-area span { font-size: 0.85rem; color: var(--text-sub); font-weight: 500; display: block; }

    #chat {
        flex: 1;
        padding: 24px;
        overflow-y: auto;
        display: flex;
        flex-direction: column;
        gap: 16px;
        scrollbar-width: none;
        position: relative;
        /* Ensure content is never clipped */
        min-height: 0; 
    }

    #chat::-webkit-scrollbar { display: none; }

    #welcome-screen {
        flex: 1;
        display: flex;
        flex-direction: column;
        justify-content: center; 
        align-items: flex-start; 
        padding: 0 40px; 
        animation: fadeInWelcome 0.8s ease-out forwards;
    }

    .welcome-title {
        font-size: clamp(1.8rem, 8vw, 2.4rem);
        font-weight: 600;
        background: linear-gradient(to right, #0071e3, #5595f5);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        margin: 0;
        letter-spacing: -1px;
        line-height: 1.2;
    }

    .welcome-sub {
        font-size: clamp(1.1rem, 5vw, 1.3rem);
        color: var(--text-sub);
        font-weight: 400;
        margin-top: 8px;
        opacity: 0.7;
    }

    /* 🔥 TYPING ANIMATION DOTS */
    .typing-bubble {
        display: flex !important;
        align-items: center;
        gap: 5px;
        padding: 12px 20px !important;
        width: fit-content;
        min-height: 45px;
    }

    .dot {
        width: 6px;
        height: 6px;
        background: var(--text-sub);
        border-radius: 50%;
        animation: bounce 1.4s infinite ease-in-out both;
        opacity: 0.6;
    }

    .dot:nth-child(1) { animation-delay: -0.32s; }
    .dot:nth-child(2) { animation-delay: -0.16s; }

    @keyframes bounce {
        0%, 80%, 100% { transform: scale(0); }
        40% { transform: scale(1.0); }
    }

    /* 🔥 MESSAGE STYLES */
    .msg {
        max-width: 85%;
        padding: 14px 18px;
        font-size: 0.95rem;
        line-height: 1.5;
        border-radius: 22px;
        opacity: 0;
        transform: translateY(15px);
        animation: bubblePop 0.4s cubic-bezier(0.15, 0.9, 0.3, 1.1) forwards;
        word-wrap: break-word;
        position: relative;
        z-index: 5;
    }

    .bot-msg { align-self: flex-start; background: var(--bot-bubble); color: var(--text-header); border: 1px solid var(--glass-border); border-bottom-left-radius: 6px; }
    .user-msg { align-self: flex-end; background: var(--primary-blue); color: white; border-bottom-right-radius: 6px; box-shadow: 0 4px 15px rgba(0, 113, 227, 0.2); }

    .input-bar {
        padding: 24px;
        display: flex;
        align-items: center;
        gap: 12px;
        border-top: 1px solid var(--glass-border);
        background: rgba(255, 255, 255, 0.05);
        flex-shrink: 0;
    }

    input {
        flex: 1;
        background: var(--bot-bubble);
        border: 1.5px solid var(--glass-border);
        color: var(--text-header);
        font-family: var(--font-main);
        padding: 14px 22px;
        border-radius: 25px;
        outline: none;
        font-size: 1rem;
    }

    .send-pill {
        background: var(--primary-blue);
        border: 1.5px solid rgba(255, 255, 255, 0.3);
        color: #ffffff;
        width: 52px; height: 52px;
        min-width: 52px; min-height: 52px;
        border-radius: 50%;
        cursor: pointer;
        display: flex; align-items: center; justify-content: center;
        flex-shrink: 0;
        transition: all 0.3s ease;
    }

    .send-pill:hover { transform: scale(1.05); box-shadow: 0 0 15px var(--primary-blue); }

    /* Keyframes */
    @keyframes bubblePop { to { opacity: 1; transform: translateY(0); } }
    @keyframes fadeInWelcome { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

    .theme-btn { background: var(--glass-bg); border: 1.5px solid var(--glass-border); padding: 6px 20px; border-radius: 30px; cursor: pointer; color: var(--text-header); }
</style>
</head>
<body>

<div class="chat-shell">
    <header>
        <div class="logo-area">
            <h1>NaviGo AI</h1>
            <span>Your CAMANAVA Guide</span>
        </div>
        <button class="theme-btn" onclick="toggleTheme()" aria-label="Toggle Dark Mode">⏾</button>
    </header>
    
    <div id="chat">
        <div id="welcome-screen">
            <h2 class="welcome-title">Hi!</h2>
            <p class="welcome-sub">What can I help you today?</p>
        </div>
    </div>

    <div class="input-bar">
        <input id="input" type="text" placeholder="Where do you want to go?" onkeypress="handleKeyPress(event)" autocomplete="off">
        <button class="send-pill" onclick="send()" aria-label="Send Message">
            <svg width="24" height="24" viewBox="0 0 512 512" fill="white"><path d="M494.8 214.8L66.7 15.6c-41.3-19-86.4 20.3-71.1 61.3l57 154.5c2.6 7 9.4 11.6 16.9 11.6H240c8.8 0 16 7.2 16 16s-7.2 16-16 16H69.4c-7.5 0-14.3 4.6-16.9 11.6l-57 154.5c-15.3 41 29.8 80.3 71.1 61.3l428.1-199.2c34.3-16 34.3-64.7 0-80.7z"/></svg>
        </button>
    </div>
</div>

<script>
    let history = [];

    function toggleTheme() {
        const body = document.body;
        const btn = document.querySelector('.theme-btn');
        body.classList.toggle('dark-mode');
        btn.innerHTML = body.classList.contains('dark-mode') ? "☀︎" : "⏾";
    }

    function handleKeyPress(e) { if (e.key === 'Enter') send(); }

    function hideWelcome() {
        const welcome = document.getElementById('welcome-screen');
        if (welcome) {
            welcome.style.opacity = '0';
            setTimeout(() => welcome.remove(), 300);
        }
    }

    async function send() {
        const input = document.getElementById('input');
        const msg = input.value.trim();
        if (!msg) return;

        hideWelcome();
        const chat = document.getElementById('chat');
        
        // 1. User Message
        chat.innerHTML += `<div class="msg user-msg">${msg}</div>`;
        input.value = '';
        chat.scrollTop = chat.scrollHeight;

        // 2. Inject Typing Dots
        const typingId = "typing-" + Date.now();
        const typingHTML = `
            <div class="msg bot-msg typing-bubble" id="${typingId}">
                <div class="dot"></div><div class="dot"></div><div class="dot"></div>
            </div>`;
        chat.innerHTML += typingHTML;
        chat.scrollTop = chat.scrollHeight;

        try {
            const res = await fetch('https://camanava-bot.onrender.com/chat', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ message: msg, history: history })
            });

            const data = await res.json();
            
            // 3. Remove Dots & Show Response
            const indicator = document.getElementById(typingId);
            if (indicator) indicator.remove();
            
            chat.innerHTML += `<div class="msg bot-msg">${data.response}</div>`;
            history = data.history;
            chat.scrollTop = chat.scrollHeight;
        } catch (error) {
            const indicator = document.getElementById(typingId);
            if (indicator) indicator.remove();
            chat.innerHTML += `<div class="msg bot-msg" style="color:red">Error! Check connection.</div>`;
        }
    }
</script>
</body>
</html>
