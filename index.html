<script>
    // --- AUTHENTICATION STATE ---
    let authToken = localStorage.getItem('authToken') || '';

    // Function called by Flutter when the WebView loads (via runJavaScript)
    window.handleAppLogin = function(uid, token, displayName) {
        authToken = token;
        localStorage.setItem('authToken', token);
        localStorage.setItem('uid', uid);
        document.getElementById('login-gate').style.display = 'none';
        console.log("Flutter Auth Received.");
    };

    // Check for auth on load
    window.addEventListener('DOMContentLoaded', () => {
        if (!authToken) {
            setTimeout(() => {
                if (!authToken) document.getElementById('login-gate').style.display = 'flex';
            }, 1000);
        }
    });
