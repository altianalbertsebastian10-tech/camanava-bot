<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>CamaNaviGo: Chat</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap');

        :root {
            --primary-blue: #0052cc; /* Professional Corporate Blue */
            --bg-scaffold: #f8f9fa;  /* Clean Solid Grey/White */
            --surface: #ffffff;      /* Solid Surface */
            --border: #e1e4e8;       /* Clean Hairline Border */
            --text-header: #1a1a1b;
            --text-sub: #586069;
            --bot-bubble: #f1f3f4;
            --transition-speed: 0.3s;
            --font-main: 'Poppins', sans-serif;
        }

        body.dark-mode {
            --bg-scaffold: #0d1117;
            --surface: #161b22;
            --border: #30363d;
            --text-header: #f0f6fc;
            --text-sub: #8b949e;
            --bot-bubble: #21262d;
            --primary-blue: #58a6ff;
        }

        body {
            margin: 0;
            background-color: var(--bg-scaffold);
            transition: background-color var(--transition-speed) ease;
            height: 100dvh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: var(--font-main);
            overflow: hidden;
        }

        .chat-shell {
            width: 100%;
            max-width: 480px;
            height: 90dvh;
            display: flex;
            flex-direction: column;
            background: var(--surface);
            border-radius: 20px; /* Reduced from 38px for a sharper look */
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.08);
            border: 1px solid var(--border);
            overflow: hidden;
            transition: all 0.4s ease;
            z-index: 10;
        }

        header {
            padding: 20px 24px;
            background: var(--surface);
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-shrink: 0;
        }

        header h1 { 
            font-weight: 700; 
            font-size: 1.2rem; 
            margin: 0; 
            color: var(--text-header);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .logo-area span { 
            font-size: 0.75rem; 
            color: var(--text-sub); 
            font-weight: 500; 
            display: block; 
        }

        #chat {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 16px;
            scrollbar-width: none;
            position: relative;
            background: var(--surface);
        }

        #chat::-webkit-scrollbar { display: none; }

        /* FIXED WELCOME SCREEN CENTERING */
        #welcome-screen {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center; /* Vertical Center */
            align-items: center;     /* Horizontal Center */
            text-align: center;
            padding: 0 30px;
            min-height: 100%;
        }

        .welcome-title {
            background: linear-gradient(135deg, var(--primary-blue), #00a8ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-size: clamp(3rem, 15vw, 4rem); 
            font-weight: 800;
            margin: 0;
            letter-spacing: -2px;
            line-height: 1;
        }

        .welcome-sub {
            font-size: 1.1rem;
            color: var(--text-sub);
            margin-top: 12px;
            font-weight: 400;
        }

        /* TYPING DOTS */
        .typing-bubble {
            display: flex !important;
            align-items: center;
            gap: 5px;
            padding: 12px 20px !important;
            width: fit-content;
            background: var(--bot-bubble) !important;
            border: none !important;
        }

        .dot {
            width: 6px;
            height: 6px;
            background: var(--text-sub);
            border-radius: 50%;
            animation: bounce 1.4s infinite ease-in-out both;
            opacity: 0.6;
        }

        .dot:nth-child(1) { animation-delay: -0.32s; }
        .dot:nth-child(2) { animation-delay: -0.16s; }

        @keyframes bounce {
            0%, 80%, 100% { transform: scale(0); }
            40% { transform: scale(1.0); }
        }

        /* MESSAGE STYLES */
        .msg {
            max-width: 82%;
            padding: 12px 16px;
            font-size: 0.95rem;
            line-height: 1.5;
            border-radius: 14px; /* Flatter radius */
            opacity: 0;
            transform: translateY(10px);
            animation: bubblePop 0.4s ease-out forwards;
        }

        .bot-msg { 
            align-self: flex-start; 
            background: var(--bot-bubble); 
            color: var(--text-header); 
            border-bottom-left-radius: 4px; 
        }

        .user-msg { 
            align-self: flex-end; 
            background: var(--primary-blue); 
            color: white; 
            border-bottom-right-radius: 4px; 
        }

        .response-container { width: 100%; }
        .resp-header { font-weight: 700; color: var(--primary-blue); margin-bottom: 4px; }
        strong { color: var(--primary-blue); font-weight: 700; }
        
        /* INPUT BAR */
        .input-bar {
            padding: 20px;
            display: flex;
            gap: 12px;
            border-top: 1px solid var(--border);
            background: var(--surface);
            flex-shrink: 0;
        }

        input {
            flex: 1;
            background: var(--bg-scaffold);
            border: 1px solid var(--border);
            color: var(--text-header);
            padding: 12px 18px;
            border-radius: 10px;
            outline: none;
            font-size: 0.95rem;
            transition: border-color 0.2s;
        }

        input:focus { border-color: var(--primary-blue); }

        .send-pill {
            background: var(--primary-blue);
            color: white;
            width: 45px; height: 45px;
            border-radius: 10px; /* Matched to input */
            border: none;
            cursor: pointer;
            display: flex; align-items: center; justify-content: center;
        }

        @keyframes bubblePop { to { opacity: 1; transform: translateY(0); } }
        
        .theme-btn { 
            background: var(--bot-bubble); 
            border: none; 
            padding: 6px 14px; 
            border-radius: 8px; 
            cursor: pointer; 
            color: var(--text-header); 
            font-weight: 600;
        }

        @media (max-width: 480px) {
            .chat-shell { height: 100dvh; border-radius: 0; border: none; }
        }
    </style>
</head>
<body>

<div class="chat-shell">
    <header>
        <div class="logo-area">
            <h1>CamaNaviGo</h1>
            <span>An AI Tourism Chatbot for CAMANAVA</span>
        </div>
        <button class="theme-btn" onclick="toggleTheme()">⏾</button>
    </header>
    
    <div id="chat">
        <div id="welcome-screen">
            <h2 class="welcome-title">Hi!</h2>
            <p class="welcome-sub">Type city or tips to get started</p>
        </div>
    </div>

    <div class="input-bar">
        <input id="input" type="text" placeholder="Type a message..." onkeypress="handleKeyPress(event)" autocomplete="off">
        <button class="send-pill" onclick="send()">
            <svg width="18" height="18" viewBox="0 0 512 512" fill="white"><path d="M494.8 214.8L66.7 15.6c-41.3-19-86.4 20.3-71.1 61.3l57 154.5c2.6 7 9.4 11.6 16.9 11.6H240c8.8 0 16 7.2 16 16s-7.2 16-16 16H69.4c-7.5 0-14.3 4.6-16.9 11.6l-57 154.5c-15.3 41 29.8 80.3 71.1 61.3l428.1-199.2c34.3-16 34.3-64.7 0-80.7z"/></svg>
        </button>
    </div>
</div>

<script>
   
    let history = [];

    function formatMessage(text) {
        if (!text) return "";
        let formatted = text.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>').replace(/\*/g, '').trim();
        let lines = formatted.split('\n').filter(line => line.trim() !== '');
        
        if (lines.length <= 1) {
            return `<div class="response-container"><div class="resp-body">${formatted}</div></div>`;
        }

        let title = lines[0];
        let bodyHTML = lines.slice(1).map(line => {
            if (line.trim().startsWith('- ')) return `<li>${line.trim().substring(2)}</li>`;
            return line + "<br>";
        }).join('');

        if (bodyHTML.includes('<li>')) bodyHTML = `<ul>${bodyHTML}</ul>`;

        return `<div class="response-container"><div class="resp-header">${title}</div><div class="resp-body">${bodyHTML}</div></div>`;
    }

    function toggleTheme() {
        document.body.classList.toggle('dark-mode');
        document.querySelector('.theme-btn').innerHTML = document.body.classList.contains('dark-mode') ? "☀︎" : "⏾";
    }

    function handleKeyPress(e) { if (e.key === 'Enter') send(); }

    function hideWelcome() {
        const welcome = document.getElementById('welcome-screen');
        if (welcome) welcome.remove();
    }

    async function send() {
        const input = document.getElementById('input');
        const msg = input.value.trim();
        if (!msg) return;

        hideWelcome();
        const chat = document.getElementById('chat');
        chat.innerHTML += `<div class="msg user-msg">${msg}</div>`;
        input.value = '';
        chat.scrollTop = chat.scrollHeight;

        const typingId = "typing-" + Date.now();
        chat.innerHTML += `<div class="msg bot-msg typing-bubble" id="${typingId}"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>`;
        chat.scrollTop = chat.scrollHeight;

        try {
            const res = await fetch('https://camanava-bot.onrender.com/chat', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ message: msg, history: history })
            });
            const data = await res.json();
            
            document.getElementById(typingId).remove();
            
            const botMsgDiv = document.createElement('div');
            botMsgDiv.className = 'msg bot-msg';
            chat.appendChild(botMsgDiv);
            
            const fullHTML = formatMessage(data.response);
            let index = 0;
            const typewriter = setInterval(() => {
                if (index < fullHTML.length) {
                    botMsgDiv.innerHTML = fullHTML.slice(0, index + 1);
                    index++;
                    chat.scrollTop = chat.scrollHeight;
                } else {
                    clearInterval(typewriter);
                }
            }, 10);

            history = data.history;
        } catch (error) {
            if(document.getElementById(typingId)) document.getElementById(typingId).remove();
            chat.innerHTML += `<div class="msg bot-msg" style="color:red">Connection Error.</div>`;
        }
    }
</script>
</body>
</html>
