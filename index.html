<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>NaviGo AI | Explore CAMANAVA</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Poppins:wght@600;700&display=swap" rel="stylesheet">
    
    <style>
    /* Importing Inter as primary high-end header font */
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;800&display=swap');

    :root {
        /* Apple-inspired Glass Palette */
        --primary-blue: #0071e3;
        --glass-bg: rgba(255, 255, 255, 0.45);
        --glass-border: rgba(255, 255, 255, 0.7);
        --text-main: #1d1d1f;
        --text-header: #000000;
        --bot-bubble: rgba(255, 255, 255, 0.7);
        --bg-scaffold: #f5f5f7;
        
        /* Font Hierarchy */
        --font-header: 'Inter', -apple-system, sans-serif;
        --font-body: 'OPPOSans', 'One Sans', 'Inter', sans-serif;
    }

    body.dark-mode {
        --glass-bg: rgba(28, 28, 30, 0.6);
        --glass-border: rgba(255, 255, 255, 0.15);
        --text-main: #f5f5f7;
        --text-header: #ffffff; /* Sharp white for dark mode headers */
        --bot-bubble: rgba(44, 44, 46, 0.85);
        --bg-scaffold: #000000;
    }

    body {
        margin: 0;
        background-color: var(--bg-scaffold);
        /* Liquid background effect */
        background-image: 
            radial-gradient(at 0% 0%, rgba(0, 113, 227, 0.15) 0px, transparent 50%),
            radial-gradient(at 100% 100%, rgba(0, 210, 255, 0.1) 0px, transparent 50%);
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        font-family: var(--font-body); /* Oppo One Sans style for body */
        color: var(--text-main);
        overflow: hidden;
    }

    .chat-shell {
        width: 100%;
        max-width: 450px;
        height: 88vh;
        background: var(--glass-bg);
        backdrop-filter: blur(40px) saturate(180%);
        -webkit-backdrop-filter: blur(40px) saturate(180%);
        border: 1px solid var(--glass-border);
        border-radius: 40px;
        display: flex;
        flex-direction: column;
        box-shadow: 0 20px 50px rgba(0,0,0,0.15);
    }

    /* Header using Gotham/Inter style */
    header {
        padding: 28px 24px;
        border-bottom: 1px solid var(--glass-border);
    }

    header h1 {
        font-family: var(--font-header);
        font-weight: 800;
        font-size: 1.5rem;
        letter-spacing: -0.03em;
        margin: 0;
        color: var(--text-header);
    }

    .logo-area span {
        font-family: var(--font-header);
        font-weight: 500;
        font-size: 0.85rem;
        opacity: 0.6;
        color: var(--text-main);
    }

    /* Messages using One Sans style */
    .msg {
        max-width: 85%;
        padding: 14px 18px;
        border-radius: 22px;
        font-size: 0.95rem;
        line-height: 1.5;
        font-family: var(--font-body);
        animation: bubblePop 0.4s cubic-bezier(0.17, 0.89, 0.32, 1.2);
    }

    .bot-msg {
        background: var(--bot-bubble);
        color: var(--text-main);
        border: 1px solid var(--glass-border);
    }

    .user-msg {
        background: var(--primary-blue);
        color: #ffffff;
        font-weight: 500;
        box-shadow: 0 8px 16px rgba(0, 113, 227, 0.25);
    }

    input {
        font-family: var(--font-body);
        font-size: 1rem;
        background: var(--bot-bubble);
        border: 1px solid var(--glass-border);
        color: var(--text-main);
        border-radius: 30px;
        padding: 12px 20px;
    }

    ::placeholder { color: var(--text-main); opacity: 0.4; }
</style>

</head>
<body>

<div class="chat-shell">
    <header>
        <div class="logo-area">
            <h1>NaviGo AI</h1>
            <span>Smart Tourism Guide</span>
        </div>
        <button class="theme-btn" onclick="toggleTheme()" aria-label="Toggle Dark Mode">🌙</button>
    </header>
    
    <div id="chat">
        <div class="msg bot-msg">Welcome! I'm NaviGo. Ready to explore the hidden gems of Caloocan, Malabon, Navotas, or Valenzuela? 🏝️</div>
    </div>

    <div class="input-bar">
        <input id="input" type="text" placeholder="Where do you want to go?" onkeypress="handleKeyPress(event)" autocomplete="off">
        <button class="send-pill" onclick="send()" aria-label="Send Message">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
        </button>
    </div>
</div>

<script>
    let history = [];

    function formatMessage(text) {
        if (text.includes('<div')) return text;
        let footer = "";
        const footerRegex = /(What next\?|Anything else\?|How can I help\?|Another one\?)$/i;
        const footerMatch = text.match(footerRegex);
        
        let remainingText = text;
        if (footerMatch) {
            footer = `<div class="resp-footer">${footerMatch[0]}</div>`;
            remainingText = text.replace(footerMatch[0], "").trim();
        }

        let header = "";
        let bodyText = remainingText;
        const bodyStartMatch = remainingText.match(/(This section is|Welcome to|You might|Here are|•)/i);
        
        if (bodyStartMatch && bodyStartMatch.index > 0) {
            header = remainingText.substring(0, bodyStartMatch.index).trim();
            bodyText = remainingText.substring(bodyStartMatch.index).trim();
        }

        if (bodyText.includes('•')) {
            let items = bodyText.split('•').map(i => i.trim()).filter(i => i);
            bodyText = `<ul>${items.map(i => `<li>${i}</li>`).join('')}</ul>`;
        }

        return `<div class="response-container">
                    ${header ? `<div class="resp-header">${header}</div>` : ""}
                    <div class="resp-body">${bodyText}</div>
                    ${footer}
                </div>`;
    }

    function toggleTheme() {
        const body = document.body;
        const btn = document.querySelector('.theme-btn');
        body.classList.toggle('dark-mode');
        btn.innerHTML = body.classList.contains('dark-mode') ? "☀️" : "🌙";
    }

    function handleKeyPress(e) {
        if (e.key === 'Enter') send();
    }

    async function send() {
        const input = document.getElementById('input');
        const msg = input.value.trim();
        if (!msg) return;

        const chat = document.getElementById('chat');
        chat.innerHTML += `<div class="msg user-msg">${msg}</div>`;
        input.value = '';
        chat.scrollTop = chat.scrollHeight;

        const loadingId = "loading-" + Date.now();
        chat.innerHTML += `<div class="msg bot-msg" id="${loadingId}" style="opacity: 0.6">NaviGo is typing...</div>`;
        chat.scrollTop = chat.scrollHeight;

        try {
            const res = await fetch('https://camanava-bot.onrender.com/chat', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({message: msg, history: history})
            });
            
            const data = await res.json();
            document.getElementById(loadingId).remove();
            
            const botHTML = formatMessage(data.response);
            chat.innerHTML += `<div class="msg bot-msg">${botHTML}</div>`;
            
            history = data.history;
            chat.scrollTop = chat.scrollHeight;
        } catch (error) {
            if(document.getElementById(loadingId)) document.getElementById(loadingId).remove();
            chat.innerHTML += `<div class="msg bot-msg" style="border: 1px solid #ff4444; color: #ff4444;">System encountered a connection blip. Please try again!</div>`;
            chat.scrollTop = chat.scrollHeight;
        }
    }
</script>

</body>
</html>
