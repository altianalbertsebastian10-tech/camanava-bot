<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>NaviGo AI | Explore CAMANAVA</title>

<style>

    @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap');

    :root {
        --primary-blue: #0071e3;
        --glass-bg: rgba(255, 255, 255, 0.45);
        --glass-border: rgba(255, 255, 255, 0.8);
        --text-header: #1d1d1f;
        --text-sub: #6e6e73;
        --bot-bubble: rgba(255, 255, 255, 0.7);
        --bg-scaffold: #f5f5f7;
        --transition-speed: 0.4s;
        --font-main: 'Poppins', sans-serif;
    }

    body.dark-mode {
        --glass-bg: rgba(28, 28, 30, 0.65);
        --glass-border: rgba(255, 255, 255, 0.15);
        --text-header: #ffffff;
        --text-sub: #ebebeb     ;
        --bot-bubble: rgba(44, 44, 46, 0.85);
        --bg-scaffold: #000000;
    }

    body {
        margin: 0;
        background-color: var(--bg-scaffold);
        transition: background-color var(--transition-speed) ease;
        background-image: 
            radial-gradient(at 0% 0%, rgba(0, 113, 227, 0.25) 0px, transparent 50%),
            radial-gradient(at 100% 100%, rgba(0, 210, 255, 0.2) 0px, transparent 50%),
            radial-gradient(at 100% 0%, rgba(255, 0, 150, 0.15) 0px, transparent 50%);
        height: 100dvh;
        display: flex;
        justify-content: center;
        align-items: center;
        font-family: var(--font-main);
        overflow: hidden;
    }

    .chat-shell {
        width: 100%;
        max-width: 480px;
        height: 90dvh;
        display: flex;
        flex-direction: column;
        background: var(--glass-bg);
        backdrop-filter: blur(40px) saturate(200%);
        -webkit-backdrop-filter: blur(40px) saturate(200%);
        border-radius: 38px;
        box-shadow: 0 30px 60px rgba(0, 0, 0, 0.2);
        border: 1px solid var(--glass-border);
        overflow: hidden;
        transition: all 0.4s ease;
    }

    /* --- THE FIX FOR THAT SCREENSHOT --- */
    #welcome-screen {
        flex: 1;
        display: flex;
        flex-direction: column;
        justify-content: center; /* Vertical center */
        align-items: flex-start; /* Left align */
        padding: 0 40px; /* Strong left-side breathing room */
        animation: fadeInWelcome 0.8s ease-out;
    }

    .welcome-title {
        font-size: clamp(2.5rem, 10vw, 3.5rem);
        font-weight: 800;
        background: linear-gradient(to right, #0071e3, #5595f5);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        margin: 0;
        letter-spacing: -2px;
        line-height: 1.1;
    }

    .welcome-sub {
        font-size: clamp(1.4rem, 6vw, 2rem);
        color: var(--text-sub);
        font-weight: 600;
        margin-top: 10px;
        opacity: 0.8;
        letter-spacing: -0.5px;
    }

    @media (max-width: 600px) { 
        .chat-shell {
            height: 100dvh;
            max-height: 100dvh;
            border-radius: 0;
        }
        #welcome-screen {
            padding: 0 30px; /* Balanced for small screens */
        }
        .input-bar {
            padding: 16px 20px !important;
            padding-bottom: calc(env(safe-area-inset-bottom) + 16px) !important;
        }
    }

    @media(max-width: 320px){
        .send-pill {
            width: auto;
            height: 30px;
        }
    }

    header {
        padding: 24px 28px;
        border-bottom: 1px solid var(--glass-border);
        display: flex;
        justify-content: space-between;
        align-items: center;
        flex-shrink: 0;
    }

    header h1 { font-weight: 700; font-size: 1.5rem; margin: 0; color: var(--text-header); }
    .logo-area span { font-size: 0.85rem; color: var(--text-sub); font-weight: 500; display: block; }

    #chat {
        flex: 1;
        padding: 24px;
        overflow-y: auto;
        display: flex;
        flex-direction: column;
        gap: 16px;
        scrollbar-width: none;
    }
    #chat::-webkit-scrollbar { display: none; }

    .input-bar {
        padding: 24px;
        display: flex;
        align-items: center;
        gap: 12px;
        border-top: 1px solid var(--glass-border);
        background: rgba(255, 255, 255, 0.05);
        flex-shrink: 0;
    }

    input {
        flex: 1;
        background: var(--bot-bubble);
        border: 1.5px solid var(--glass-border);
        color: var(--text-header);
        font-family: var(--font-main);
        padding: 14px 22px;
        border-radius: 25px;
        outline: none;
        font-size: 1rem;
    }

    .send-pill {
        background: var(--primary-blue);
        color: white;
        border: none;
        width: auto;
        height: 52px;
        border-radius: 50%;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 8px 20px rgba(0, 113, 227, 0.4);
    }

    /* Message Styles */
    .msg {
        max-width: 85%;
        padding: 14px 18px;
        font-size: 0.95rem;
        line-height: 1.5;
        border-radius: 22px;
        opacity: 0;
        transform: scale(0.9) translateY(10px);
        animation: bubblePop 0.4s cubic-bezier(0.15, 0.9, 0.3, 1.1) forwards;
    }
    @keyframes bubblePop { to { opacity: 1; transform: scale(1) translateY(0); } }
    @keyframes fadeInWelcome { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

    .bot-msg { align-self: flex-start; background: var(--bot-bubble); color: var(--text-header); border: 1px solid var(--glass-border); border-bottom-left-radius: 6px; }
    .user-msg { align-self: flex-end; background: var(--primary-blue); color: white; border-bottom-right-radius: 6px; }

    .theme-btn { background: var(--glass-bg); border: 1.5px solid var(--glass-border); padding: 6px 20px; border-radius: 30px; cursor: pointer; color: var(--text-header); }
    
</style>


</head>
<body>

<div class="chat-shell">
    <header>
        <div class="logo-area">
            <h1>NaviGo AI</h1>
            <span>Smart Tourism Guide</span>
        </div>
        <button class="theme-btn" onclick="toggleTheme()" aria-label="Toggle Dark Mode">🌙</button>
    </header>
    
    <div id="chat">
        <div id="welcome-screen">
            <h2 class="welcome-title">Hi User</h2>
            <p class="welcome-sub">What can I help you today?</p>
        </div>
    </div>

    <div class="input-bar">
        <input id="input" type="text" placeholder="Where do you want to go?" onkeypress="handleKeyPress(event)" autocomplete="off">
        <button class="send-pill" onclick="send()" aria-label="Send Message">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
        </button>
    </div>
</div>

<script>
    let history = [];

    function formatMessage(text) {
    if (!text || text.includes('<div class="response-container"')) return text;

    let cleanText = text.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
    cleanText = cleanText.replace(/\*/g, '').trim();

    let lines = cleanText.split('\n').filter(line => line.trim() !== '');
    if (lines.length === 0) return text;

    let header = lines[0].trim(); 
    let bodyLines = lines.slice(1);

    // 🔥 FIXED: Added check for bodyLines.length to prevent the "undefined" error
    if (bodyLines.length > 0 && bodyLines[0].trim().startsWith('- ')) {
        bodyLines[0] = bodyLines[0].trim().replace(/^- /, '');
    }

    let footer = "";

    // 3. Extract Footer
    const footerKeywords = ["Related Spots:", "Other Heritage Spots:", "Gusto mo ba", "Would you like"];
    for (let i = 0; i < bodyLines.length; i++) {
        let line = bodyLines[i].trim();
        for (let keyword of footerKeywords) {
            // Changed to check if the line STARTS with the keyword for better accuracy
            if (line.startsWith(keyword)) {
                footer = bodyLines.slice(i).join(' ');
                bodyLines = bodyLines.slice(0, i);
                break;
            }
        }
        if (footer) break; // Exit outer loop if footer found
    }

    let bodyText = bodyLines.join('\n').trim();

    // 4. Convert dashes to lists
    if (bodyText.includes('- ')) {
        let items = bodyText.split('- ').map(i => i.trim()).filter(i => i);
        bodyText = `<ul>${items.map(i => `<li>${i}</li>`).join('')}</ul>`;
    } else {
        bodyText = bodyText.replace(/\n/g, '<br>');
    }

    return `
        <div class="response-container">
            <div class="resp-header">${header}</div>
            <div class="resp-body">${bodyText}</div>
            ${footer ? `<div class="resp-footer">${footer}</div>` : ''}
        </div>
    `;
}
    function toggleTheme() {
        const body = document.body;
        const btn = document.querySelector('.theme-btn');
        body.classList.toggle('dark-mode');
        btn.innerHTML = body.classList.contains('dark-mode') ? "☀️" : "🌙";
    }

    function handleKeyPress(e) {
        if (e.key === 'Enter') send();
    }

    // logic to hide welcome screen on first message
    function hideWelcome() {
        const welcome = document.getElementById('welcome-screen');
        if (welcome) {
            welcome.style.opacity = '0';
            setTimeout(() => welcome.remove(), 300);
        }
    }

    async function send() {
    const input = document.getElementById('input');
    const msg = input.value.trim();
    if (!msg) return;

    // Hide the Gemini-style welcome screen
        hideWelcome();

    const chat = document.getElementById('chat');
    chat.innerHTML += `<div class="msg user-msg">${msg}</div>`;
    input.value = '';
    chat.scrollTop = chat.scrollHeight;

    const loadingId = "loading-" + Date.now();
    chat.innerHTML += `<div class="msg bot-msg" id="${loadingId}" style="opacity: 0.6">NaviGo is typing...</div>`;
    chat.scrollTop = chat.scrollHeight;

    try {
        const res = await fetch('https://camanava-bot.onrender.com/chat', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'Accept': 'application/json'
            },
            body: JSON.stringify({ message: msg, history: history })
        });

        if (!res.ok) {
            // This will show if the error is 404 (Not Found) or 500 (Server Error)
            throw new Error(`HTTP Error ${res.status}`);
        }
        
        const data = await res.json();
        document.getElementById(loadingId).remove();
        
        const botHTML = formatMessage(data.response);
        chat.innerHTML += `<div class="msg bot-msg">${botHTML}</div>`;
        
        history = data.history;
        chat.scrollTop = chat.scrollHeight;
    } catch (error) {
        if(document.getElementById(loadingId)) document.getElementById(loadingId).remove();
        // This will display the EXACT error code to help us debug
        chat.innerHTML += `<div class="msg bot-msg" style="border: 1px solid #ff4444; color: #ff4444;">Debug: ${error.message}</div>`;
        chat.scrollTop = chat.scrollHeight;
    }
}
</script>

</body>
</html>
