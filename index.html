<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>NaviGo AI | Explore CAMANAVA</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Poppins:wght@600;700&display=swap" rel="stylesheet">
    
    <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap');

    :root {
        --primary-blue: #0071e3;
        --glass-bg: rgba(255, 255, 255, 0.4);
        --glass-border: rgba(255, 255, 255, 0.7);
        --text-header: #1d1d1f;
        --text-sub: #6e6e73;
        --bot-bubble: rgba(255, 255, 255, 0.6);
        --bg-scaffold: #f5f5f7;
        --transition-speed: 0.5s;
        
        --font-header: 'Inter', sans-serif;
        --font-body: 'OPPOSans', 'One Sans', sans-serif;
    }

    body.dark-mode {
        --glass-bg: rgba(28, 28, 30, 0.5);
        --glass-border: rgba(255, 255, 255, 0.1);
        --text-header: #ffffff;
        --text-sub: #a1a1a6;
        --bot-bubble: rgba(44, 44, 46, 0.7);
        --bg-scaffold: #000000;
    }

    /* Transition para sa buong body pag nag-toggle */
    body {
        margin: 0;
        background-color: var(--bg-scaffold);
        transition: background-color var(--transition-speed) cubic-bezier(0.4, 0, 0.2, 1);
        background-image: 
            radial-gradient(at 0% 0%, rgba(0, 113, 227, 0.2) 0px, transparent 50%),
            radial-gradient(at 100% 100%, rgba(0, 210, 255, 0.15) 0px, transparent 50%),
            radial-gradient(at 100% 0%, rgba(255, 0, 150, 0.1) 0px, transparent 50%);
        height: 100dvh;
        display: flex;
        justify-content: center;
        align-items: center;
        font-family: var(--font-body);
        overflow: hidden;
    }

    .chat-shell {
        width: 480px;
        height: 90dvh;
        max-height: 850px;
        background: var(--glass-bg);
        backdrop-filter: blur(40px) saturate(180%);
        -webkit-backdrop-filter: blur(40px) saturate(180%);
        display: flex;
        flex-direction: column;
        border-radius: 32px;
        box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
        border: 1px solid var(--glass-border);
        overflow: hidden;
        transition: all var(--transition-speed) ease;
    }

    header {
        padding: 24px;
        border-bottom: 1px solid var(--glass-border);
        display: flex;
        justify-content: space-between;
        align-items: center;
    }

    header h1 {
        transition: color var(--transition-speed) ease;
    }

    /* Liquid Glass Toggle Button */
    .theme-btn {
        background: rgba(255, 255, 255, 0.1);
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
        border: 1px solid var(--glass-border);
        padding: 8px 18px;
        border-radius: 20px;
        cursor: pointer;
        font-size: 1.1rem;
        transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 4px 15px rgba(0,0,0,0.05);
    }

    .theme-btn:hover {
        transform: scale(1.1);
        background: rgba(255, 255, 255, 0.2);
    }

    .theme-btn:active {
        transform: scale(0.9);
    }

    #chat {
        flex: 1;
        padding: 24px;
        overflow-y: auto;
        display: flex;
        flex-direction: column;
        gap: 16px;
    }

    /* Liquid Bubble Animation */
    .msg {
        max-width: 82%;
        padding: 14px 18px;
        font-size: 0.93rem;
        line-height: 1.6;
        border-radius: 22px;
        position: relative;
        /* Animation properties */
        opacity: 0;
        transform: scale(0.8) translateY(20px);
        animation: bubblePop 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        transition: background-color var(--transition-speed) ease, color var(--transition-speed) ease;
    }

    @keyframes bubblePop {
        to {
            opacity: 1;
            transform: scale(1) translateY(0);
        }
    }

    .bot-msg {
        align-self: flex-start;
        background: var(--bot-bubble);
        color: var(--text-header);
        backdrop-filter: blur(15px);
        border: 1px solid var(--glass-border);
        box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.07);
    }

    .user-msg {
        align-self: flex-end;
        background: var(--primary-blue);
        color: white;
        box-shadow: 0 8px 20px rgba(0, 113, 227, 0.3);
        border: 1px solid rgba(255,255,255,0.1);
    }

    .input-bar {
        padding: 20px 24px;
        display: flex;
        align-items: center;
        gap: 12px;
        border-top: 1px solid var(--glass-border);
        background: rgba(255, 255, 255, 0.05);
    }

    input {
        flex: 1;
        background: var(--bot-bubble);
        backdrop-filter: blur(10px);
        border: 1px solid var(--glass-border);
        color: var(--text-header);
        padding: 14px 20px;
        border-radius: 20px;
        outline: none;
        transition: all 0.3s ease;
    }

    input:focus {
        border-color: var(--primary-blue);
        box-shadow: 0 0 15px rgba(0, 113, 227, 0.1);
    }

    .send-pill {
        background: var(--primary-blue);
        color: white;
        border: none;
        width: 50px;
        height: 50px;
        border-radius: 50%; /* Rounded para mas liquid feel */
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        box-shadow: 0 4px 15px rgba(0, 113, 227, 0.3);
    }

    .send-pill:hover {
        transform: scale(1.1) rotate(5deg);
    }

    .send-pill:active {
        transform: scale(0.9);
    }

    /* Custom Scrollbar for Liquid Look */
    #chat::-webkit-scrollbar {
        width: 6px;
    }
    #chat::-webkit-scrollbar-thumb {
        background: var(--glass-border);
        border-radius: 10px;
    }
</style>

</head>
<body>

<div class="chat-shell">
    <header>
        <div class="logo-area">
            <h1>NaviGo AI</h1>
            <span>Smart Tourism Guide</span>
        </div>
        <button class="theme-btn" onclick="toggleTheme()" aria-label="Toggle Dark Mode">🌙</button>
    </header>
    
    <div id="chat">
        <div class="msg bot-msg">Welcome! I'm NaviGo. Ready to explore the hidden gems of Caloocan, Malabon, Navotas, or Valenzuela? 🏝️</div>
    </div>

    <div class="input-bar">
        <input id="input" type="text" placeholder="Where do you want to go?" onkeypress="handleKeyPress(event)" autocomplete="off">
        <button class="send-pill" onclick="send()" aria-label="Send Message">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
        </button>
    </div>
</div>

<script>
    let history = [];

    function formatMessage(text) {
        if (text.includes('<div')) return text;
        let footer = "";
        const footerRegex = /(What next\?|Anything else\?|How can I help\?|Another one\?)$/i;
        const footerMatch = text.match(footerRegex);
        
        let remainingText = text;
        if (footerMatch) {
            footer = `<div class="resp-footer">${footerMatch[0]}</div>`;
            remainingText = text.replace(footerMatch[0], "").trim();
        }

        let header = "";
        let bodyText = remainingText;
        const bodyStartMatch = remainingText.match(/(This section is|Welcome to|You might|Here are|•)/i);
        
        if (bodyStartMatch && bodyStartMatch.index > 0) {
            header = remainingText.substring(0, bodyStartMatch.index).trim();
            bodyText = remainingText.substring(bodyStartMatch.index).trim();
        }

        if (bodyText.includes('•')) {
            let items = bodyText.split('•').map(i => i.trim()).filter(i => i);
            bodyText = `<ul>${items.map(i => `<li>${i}</li>`).join('')}</ul>`;
        }

        return `<div class="response-container">
                    ${header ? `<div class="resp-header">${header}</div>` : ""}
                    <div class="resp-body">${bodyText}</div>
                    ${footer}
                </div>`;
    }

    function toggleTheme() {
        const body = document.body;
        const btn = document.querySelector('.theme-btn');
        body.classList.toggle('dark-mode');
        btn.innerHTML = body.classList.contains('dark-mode') ? "☀️" : "🌙";
    }

    function handleKeyPress(e) {
        if (e.key === 'Enter') send();
    }

    async function send() {
        const input = document.getElementById('input');
        const msg = input.value.trim();
        if (!msg) return;

        const chat = document.getElementById('chat');
        chat.innerHTML += `<div class="msg user-msg">${msg}</div>`;
        input.value = '';
        chat.scrollTop = chat.scrollHeight;

        const loadingId = "loading-" + Date.now();
        chat.innerHTML += `<div class="msg bot-msg" id="${loadingId}" style="opacity: 0.6">NaviGo is typing...</div>`;
        chat.scrollTop = chat.scrollHeight;

        try {
            const res = await fetch('https://camanava-bot.onrender.com/chat', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({message: msg, history: history})
            });
            
            const data = await res.json();
            document.getElementById(loadingId).remove();
            
            const botHTML = formatMessage(data.response);
            chat.innerHTML += `<div class="msg bot-msg">${botHTML}</div>`;
            
            history = data.history;
            chat.scrollTop = chat.scrollHeight;
        } catch (error) {
            if(document.getElementById(loadingId)) document.getElementById(loadingId).remove();
            chat.innerHTML += `<div class="msg bot-msg" style="border: 1px solid #ff4444; color: #ff4444;">System encountered a connection blip. Please try again!</div>`;
            chat.scrollTop = chat.scrollHeight;
        }
    }
</script>

</body>
</html>
